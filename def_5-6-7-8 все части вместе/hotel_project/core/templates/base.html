<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} Гостиница {% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"> 
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        .breadcrumb-item a{
            color:#6c757d;
            text-decoration: none;
        }

        .breadcrumb-item a:hover{
            color: #0d6efd;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        {% if messages %}
            <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1055;">
                {% for message in messages %}
                    <div class="toast show align-items-center text-white bg-{{ message.tags }} border-0" role="alert">
                        <div class="d-flex">
                            <div class="toast-body">
                                {{ message }}
                            </div>
                            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                        </div>
                    </div>
                
                {% endfor %}

            </div>
        {% endif %}
            <div class="container">
                <a class="navbar-brand" href="{% url 'core:home' %}">
                    <i class="bi bi-house"></i> Гостиница
                </a>

                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class= "nav-link" href="{% url 'hotel:room_list' %}">
                            <i class="bi bi-door-open"></i> Номера
                        </a> 
                    </li>

                    <li class=" nav-item">
                        <a class= "nav-link" href="{% url 'hotel:booking_create' %}">
                            <i class="bi bi-calendar-check"></i> Создание брони
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'core:stats'%}">
                            <i class="bi bi-bar-chart"></i>Статистика
                        </a>
                    </li>
                </ul>    
            </div>
        </div>
    </nav>

    <div class="container mt-4">
            {% block content %}

            {% endblock %}
        </div>
    
</body>
</html>
