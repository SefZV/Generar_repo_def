{% extends 'base.html' %}
{% block content %}

<table class="table table-striped table-hover">
    
    <thead class="table-dark">
        <tr>
            <th>Номер комнаты</th>
            <th>Тип</th>
            <th>Этаж</th>
            <th>Цена за ночь</th>

        </tr>
    </thead>
    <tbody>
        {% for room in rooms %}
        <tr>
            <td>{{ room.number }}</td>
            <td>{{ room.room_type}}</td>
            <td>{{ room.floor }}</td>
            <td> {{ room.price_per_night }}</td>
        </tr>
        {% empty %}
        <tr>
            <td>Номеров пока нету</td>
        </tr>
        {% endfor %}

    </tbody>
</table>


{% endblock %}
